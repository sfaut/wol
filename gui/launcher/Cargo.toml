[package]
name = "wol-gui"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Wol launcher: starts the desktop app from the runtime subfolder of a release"
authors = ["Sébastien Faut <sebastien.faut@gmail.com>"]
license = "MIT"
publish = false
build = "build.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
