# Builds and tests the CLI on Windows, Linux and macOS (x86_64 and ARM), and publishes the
# desktop app on Windows. Release builds are kept as workflow artifacts.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners run the tests; the others are cross-compiled release builds.
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { name: windows-arm64, os: windows-latest, target: aarch64-pc-windows-msvc, test: false }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, test: true }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, test: true }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x64, os: macos-latest, target: x86_64-apple-darwin, test: false }
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          key: ${{ matrix.target }}

      # Static Linux binaries are linked against musl.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - if: matrix.name == 'linux-x64'
        run: cargo fmt --check

      - run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - if: matrix.test
        run: cargo test

      - run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: wol-${{ matrix.name }}
          path: |
            cli/target/${{ matrix.target }}/release/wol
            cli/target/${{ matrix.target }}/release/wol.exe
          if-no-files-found: error

  gui:
    name: GUI (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli -> target
            gui/launcher -> target

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The publish copies cli/target/release/wol.exe and the launcher next to the GUI.
      - name: Build the CLI
        working-directory: cli
        run: cargo build --release

      - name: Lint and build the launcher
        working-directory: gui/launcher
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
          cargo build --release

      # The Native AOT link runs vswhere.exe, which lives in the Visual Studio Installer folder.
      - name: Publish the GUI
        working-directory: gui
        run: |
          $env:PATH += ';C:\Program Files (x86)\Microsoft Visual Studio\Installer'
          dotnet publish src/Wol.Desktop --configuration Release --runtime win-x64 --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: wol-gui-windows-x64
          path: gui/publish
          if-no-files-found: error
