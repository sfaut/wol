[package]
name = "wol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Wake-on-LAN machine manager: monitor remote machines and wake them up"
authors = ["Sébastien Faut <sebastien.faut@gmail.com>"]
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }

[target."cfg(unix)".dependencies]
socket2 = "0.6.5"
